<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>MediaPipe Face Landmarker Test</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #111; color: #fff; }
    body { display: grid; min-height: 100dvh; place-items: center; padding: 16px; }
    main { width: min(100%, 720px); }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 14px; color: rgba(255,255,255,.68); font-size: 13px; line-height: 1.5; }
    .stage { position: relative; overflow: hidden; width: 100%; aspect-ratio: 3 / 4; border: 1px solid rgba(255,255,255,.16); border-radius: 18px; background: #050505; }
    video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    video { transform: scaleX(-1); }
    canvas { pointer-events: none; }
    .panel { display: grid; gap: 8px; margin-top: 12px; padding: 12px; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; background: #1b1b1d; }
    .row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
    .row span { color: rgba(255,255,255,.62); }
    .ok { color: #b9f6d0; }
    .error { color: #ffaaaa; }
    button { width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 12px; background: #ffd6ea; color: #26151e; font: inherit; font-weight: 700; }
    button:disabled { opacity: .5; }
    @media (orientation: landscape) { body { padding: 10px; } main { width: min(100%, 980px); } .stage { aspect-ratio: 16 / 9; } }
  </style>
</head>
<body>
  <main>
    <h1>MediaPipe 3D顔追跡テスト</h1>
    <p>ぶたフレームが、顔の左右・上下・傾きに追従するか確認します。</p>
    <div class="stage" id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <div class="panel" role="status" aria-live="polite">
      <div class="row"><span>状態</span><strong id="status">開始待ち</strong></div>
      <div class="row"><span>検出した顔</span><strong id="face-count">0</strong></div>
      <div class="row"><span>3D変換行列</span><strong id="matrix-status">未確認</strong></div>
      <div class="row"><span>PNG追従</span><strong id="effect-status">準備中</strong></div>
      <div class="row"><span>Yaw（左右）</span><strong id="yaw">—</strong></div>
      <div class="row"><span>Pitch（上下）</span><strong id="pitch">—</strong></div>
      <div class="row"><span>Roll（傾き）</span><strong id="roll">—</strong></div>
      <div class="row"><span>奥行き（相対値）</span><strong id="depth">—</strong></div>
      <div class="row"><span>角度の揺れ</span><strong id="jitter">—</strong></div>
      <div class="row"><span>処理時間</span><strong id="latency">—</strong></div>
    </div>
    <button id="start-btn" type="button">カメラテストを開始</button>
  </main>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0";

    const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
    const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0/wasm";
    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const context = canvas.getContext("2d");
    const startButton = document.getElementById("start-btn");
    const status = document.getElementById("status");
    const faceCount = document.getElementById("face-count");
    const matrixStatus = document.getElementById("matrix-status");
    const effectStatus = document.getElementById("effect-status");
    const yawOutput = document.getElementById("yaw");
    const pitchOutput = document.getElementById("pitch");
    const rollOutput = document.getElementById("roll");
    const depthOutput = document.getElementById("depth");
    const jitterOutput = document.getElementById("jitter");
    const latency = document.getElementById("latency");
    let landmarker = null;
    let lastVideoTime = -1;
    let running = false;
    let smoothedPose = null;
    let previousRawPose = null;
    const poseDeltas = [];
    const pigImage = new Image();
    pigImage.src = "mimi.png?v=20261102-mediapipe-test";
    let pigHole = null;

    function setStatus(message, type = "") {
      status.textContent = message;
      status.className = type;
    }

    function resizeOverlay() {
      const bounds = canvas.getBoundingClientRect();
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(bounds.width * ratio);
      canvas.height = Math.round(bounds.height * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    async function createLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(WASM_URL);
      const options = {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: "GPU" },
        runningMode: "VIDEO",
        numFaces: 1,
        minFaceDetectionConfidence: .45,
        minFacePresenceConfidence: .45,
        minTrackingConfidence: .45,
        outputFaceBlendshapes: true,
        outputFacialTransformationMatrixes: true
      };
      try {
        return await FaceLandmarker.createFromOptions(vision, options);
      } catch {
        options.baseOptions = { modelAssetPath: MODEL_URL, delegate: "CPU" };
        return FaceLandmarker.createFromOptions(vision, options);
      }
    }

    function pointToStage(point) {
      const bounds = canvas.getBoundingClientRect();
      const sourceWidth = video.videoWidth || bounds.width;
      const sourceHeight = video.videoHeight || bounds.height;
      const scale = Math.max(bounds.width / sourceWidth, bounds.height / sourceHeight);
      const renderedWidth = sourceWidth * scale;
      const renderedHeight = sourceHeight * scale;
      const offsetX = (bounds.width - renderedWidth) / 2;
      const offsetY = (bounds.height - renderedHeight) / 2;
      return {
        x: bounds.width - (offsetX + point.x * renderedWidth),
        y: offsetY + point.y * renderedHeight
      };
    }

    function findTransparentHole(image) {
      const sample = document.createElement("canvas");
      sample.width = image.naturalWidth;
      sample.height = image.naturalHeight;
      const sampleContext = sample.getContext("2d", { willReadFrequently: true });
      sampleContext.drawImage(image, 0, 0);
      const pixels = sampleContext.getImageData(0, 0, sample.width, sample.height).data;
      const pixelCount = sample.width * sample.height;
      const visited = new Uint8Array(pixelCount);
      const queue = new Int32Array(pixelCount);
      const transparent = (index) => pixels[index * 4 + 3] < 24;
      let head = 0;
      let tail = 0;
      const enqueueOutside = (index) => {
        if (index < 0 || index >= pixelCount || visited[index] || !transparent(index)) return;
        visited[index] = 1;
        queue[tail++] = index;
      };
      for (let x = 0; x < sample.width; x += 1) {
        enqueueOutside(x);
        enqueueOutside((sample.height - 1) * sample.width + x);
      }
      for (let y = 0; y < sample.height; y += 1) {
        enqueueOutside(y * sample.width);
        enqueueOutside(y * sample.width + sample.width - 1);
      }
      while (head < tail) {
        const index = queue[head++];
        const x = index % sample.width;
        const y = Math.floor(index / sample.width);
        if (x > 0) enqueueOutside(index - 1);
        if (x + 1 < sample.width) enqueueOutside(index + 1);
        if (y > 0) enqueueOutside(index - sample.width);
        if (y + 1 < sample.height) enqueueOutside(index + sample.width);
      }

      let best = null;
      const enqueueHole = (index) => {
        if (index < 0 || index >= pixelCount || visited[index] || !transparent(index)) return;
        visited[index] = 2;
        queue[tail++] = index;
      };
      for (let start = 0; start < pixelCount; start += 1) {
        if (visited[start] || !transparent(start)) continue;
        head = 0;
        tail = 0;
        visited[start] = 2;
        queue[tail++] = start;
        let count = 0;
        let minX = sample.width;
        let minY = sample.height;
        let maxX = -1;
        let maxY = -1;
        while (head < tail) {
          const index = queue[head++];
          const x = index % sample.width;
          const y = Math.floor(index / sample.width);
          count += 1;
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
          if (x > 0) enqueueHole(index - 1);
          if (x + 1 < sample.width) enqueueHole(index + 1);
          if (y > 0) enqueueHole(index - sample.width);
          if (y + 1 < sample.height) enqueueHole(index + sample.width);
        }
        if (!best || count > best.count) best = { count, minX, minY, maxX, maxY };
      }
      if (!best || best.count < pixelCount * .01) return null;
      return {
        width: best.maxX - best.minX + 1,
        height: best.maxY - best.minY + 1,
        centerX: (best.minX + best.maxX) / 2,
        centerY: (best.minY + best.maxY) / 2
      };
    }

    function drawFaceEffect(landmarks, pose) {
      if (!landmarks || !pose || !pigHole || !pigImage.complete) return false;
      const forehead = pointToStage(landmarks[10]);
      const chin = pointToStage(landmarks[152]);
      const cheekA = pointToStage(landmarks[234]);
      const cheekB = pointToStage(landmarks[454]);
      const faceWidth = Math.hypot(cheekB.x - cheekA.x, cheekB.y - cheekA.y);
      const faceHeight = Math.hypot(chin.x - forehead.x, chin.y - forehead.y);
      const centerX = (cheekA.x + cheekB.x + forehead.x + chin.x) / 4;
      const centerY = (forehead.y + chin.y) / 2;
      const holeTargetWidth = faceWidth * 1.08;
      const holeTargetHeight = faceHeight * 1.06;
      const scaleX = holeTargetWidth / Math.max(1, pigHole.width);
      const scaleY = holeTargetHeight / Math.max(1, pigHole.height);
      const drawWidth = pigImage.naturalWidth * scaleX;
      const drawHeight = pigImage.naturalHeight * scaleY;
      const holeOffsetX = (pigHole.centerX - pigImage.naturalWidth / 2) * scaleX;
      const holeOffsetY = (pigHole.centerY - pigImage.naturalHeight / 2) * scaleY;

      context.save();
      context.translate(centerX, centerY);
      context.rotate(pose.roll * Math.PI / 180);
      context.globalAlpha = .96;
      context.drawImage(
        pigImage,
        -drawWidth / 2 - holeOffsetX,
        -drawHeight / 2 - holeOffsetY,
        drawWidth,
        drawHeight
      );
      context.restore();
      return true;
    }

    function drawOverlay(landmarks, pose) {
      const bounds = canvas.getBoundingClientRect();
      context.clearRect(0, 0, bounds.width, bounds.height);
      const effectDrawn = drawFaceEffect(landmarks, pose);
      effectStatus.textContent = effectDrawn ? "追従中" : "顔を待っています";
      effectStatus.className = effectDrawn ? "ok" : "";
      if (!landmarks) return;
      context.fillStyle = "#62f5a2";
      for (const point of landmarks) {
        const mapped = pointToStage(point);
        context.beginPath();
        context.arc(mapped.x, mapped.y, 1.25, 0, Math.PI * 2);
        context.fill();
      }
    }

    function clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function matrixToPose(matrix) {
      const elements = matrix?.data;
      if (!elements || elements.length < 16) return null;

      // MediaPipeの4x4列優先行列をXYZオイラー角へ分解する。
      const m11 = elements[0];
      const m12 = elements[4];
      const m13 = elements[8];
      const m22 = elements[5];
      const m23 = elements[9];
      const m32 = elements[6];
      const m33 = elements[10];
      const yaw = Math.asin(clamp(m13, -1, 1));
      let pitch;
      let roll;
      if (Math.abs(m13) < .9999999) {
        pitch = Math.atan2(-m23, m33);
        roll = Math.atan2(-m12, m11);
      } else {
        pitch = Math.atan2(m32, m22);
        roll = 0;
      }
      const toDegrees = 180 / Math.PI;
      return {
        yaw: yaw * toDegrees,
        pitch: pitch * toDegrees,
        roll: roll * toDegrees,
        depth: elements[14]
      };
    }

    function updatePoseReadout(matrix) {
      const rawPose = matrixToPose(matrix);
      if (!rawPose) {
        yawOutput.textContent = "—";
        pitchOutput.textContent = "—";
        rollOutput.textContent = "—";
        depthOutput.textContent = "—";
        jitterOutput.textContent = "—";
        smoothedPose = null;
        previousRawPose = null;
        poseDeltas.length = 0;
        return null;
      }

      if (previousRawPose) {
        const delta = Math.hypot(
          rawPose.yaw - previousRawPose.yaw,
          rawPose.pitch - previousRawPose.pitch,
          rawPose.roll - previousRawPose.roll
        );
        poseDeltas.push(delta);
        if (poseDeltas.length > 30) poseDeltas.shift();
      }
      previousRawPose = rawPose;

      const smoothing = .2;
      if (!smoothedPose) smoothedPose = { ...rawPose };
      for (const key of ["yaw", "pitch", "roll", "depth"]) {
        smoothedPose[key] += (rawPose[key] - smoothedPose[key]) * smoothing;
      }

      const averageJitter = poseDeltas.length
        ? poseDeltas.reduce((sum, value) => sum + value, 0) / poseDeltas.length
        : 0;
      yawOutput.textContent = `${smoothedPose.yaw >= 0 ? "+" : ""}${smoothedPose.yaw.toFixed(1)}°`;
      pitchOutput.textContent = `${smoothedPose.pitch >= 0 ? "+" : ""}${smoothedPose.pitch.toFixed(1)}°`;
      rollOutput.textContent = `${smoothedPose.roll >= 0 ? "+" : ""}${smoothedPose.roll.toFixed(1)}°`;
      depthOutput.textContent = smoothedPose.depth.toFixed(2);
      jitterOutput.textContent = `${averageJitter.toFixed(2)}°/frame`;
      return smoothedPose;
    }

    function predict() {
      if (!running) return;
      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const startedAt = performance.now();
        const result = landmarker.detectForVideo(video, startedAt);
        const faces = result.faceLandmarks || [];
        const matrices = result.facialTransformationMatrixes || [];
        faceCount.textContent = String(faces.length);
        matrixStatus.textContent = matrices.length ? "取得できています" : "取得なし";
        matrixStatus.className = matrices.length ? "ok" : "error";
        latency.textContent = `${Math.round(performance.now() - startedAt)} ms`;
        const pose = updatePoseReadout(matrices[0]);
        drawOverlay(faces[0], pose);
      }
      requestAnimationFrame(predict);
    }

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      setStatus("モデルを準備中");
      try {
        await pigImage.decode();
        pigHole ||= findTransparentHole(pigImage);
        if (!pigHole) throw new Error("ぶた画像の透明な顔穴を検出できませんでした");
        effectStatus.textContent = "準備完了";
        effectStatus.className = "ok";
        landmarker ||= await createLandmarker();
        setStatus("カメラを準備中");
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        video.srcObject = stream;
        await video.play();
        resizeOverlay();
        running = true;
        setStatus("追跡中", "ok");
        startButton.hidden = true;
        predict();
      } catch (error) {
        console.error(error);
        setStatus(`開始できません: ${error?.message || error}`, "error");
        startButton.disabled = false;
      }
    });

    window.addEventListener("resize", resizeOverlay);
    window.addEventListener("pagehide", () => {
      running = false;
      video.srcObject?.getTracks().forEach((track) => track.stop());
      landmarker?.close?.();
    });
  </script>
</body>
</html>
