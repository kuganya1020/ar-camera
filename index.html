<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="app_icon.png.optimized.png?v=20260802">
  <link rel="icon" type="image/png" href="app_icon.png.optimized.png?v=20260802">
  <title>AR Camera</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="style.css?v=20260806-device-choice-neutral">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script defer src="https://unpkg.com/ml5@1.2.1/dist/ml5.min.js"></script>
  <script defer src="sketch.js?v=20260806-device-choice-neutral"></script>
</head>
<body>
  <main id="app" aria-label="ARカメラ">
    <div id="camera-container" aria-hidden="true"></div>

    <header class="top-bar">
      <div class="top-actions">
        <button id="help-btn" class="icon-btn" type="button" aria-label="使い方">?</button>
        <button id="switch-camera-btn" class="icon-btn" type="button" aria-label="カメラを切り替える">
          <img src="switch_icon.png?v=20260802" alt="" aria-hidden="true">
        </button>
      </div>
    </header>

    <div id="status-pill" role="status" aria-live="polite">カメラを準備中</div>
    <div id="video-timer" aria-live="off">00:00</div>

    <section class="capture-ui" aria-label="撮影">
      <div class="mode-selector" role="tablist" aria-label="撮影モード">
        <button id="mode-photo" class="mode-btn active" type="button" role="tab" aria-selected="true">写真</button>
        <button id="mode-video" class="mode-btn" type="button" role="tab" aria-selected="false">動画</button>
      </div>
      <button id="main-shutter-btn" type="button" aria-label="写真を撮る"><span></span></button>
      <span id="audio-note">動画は無音です</span>
    </section>

    <nav class="effects-dock" aria-label="エフェクト">
      <button id="open-settings-btn" class="effect-add" type="button" aria-label="画像を追加">＋</button>
      <button id="edit-selected-btn" class="effect-edit" type="button" aria-label="選択中のエフェクトを編集" hidden>編集</button>
      <div id="icon-list" role="list"></div>
    </nav>

    <div id="sheet-backdrop" hidden></div>
    <section id="settings-panel" class="bottom-sheet" aria-labelledby="panel-title" aria-modal="true" role="dialog" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <h2 id="panel-title">エフェクトを追加</h2>
        <button id="close-panel-btn" class="text-btn" type="button">閉じる</button>
      </div>
      <div id="upload-section">
        <p class="step-label"><span>1</span>画像を選ぶ</p>
        <label class="file-button" for="file-input">端末から画像を選ぶ</label>
        <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp">
      </div>
      <div id="effect-edit-controls">
        <fieldset class="placement-field">
          <legend><span class="step-number">2</span>表示方法</legend>
          <div class="segmented">
            <button class="part-btn active" data-point="face" type="button">顔</button>
            <button class="part-btn" data-point="bg" type="button">背景・フレーム</button>
          </div>
        </fieldset>
        <p id="face-edit-status" class="edit-status" role="status">画像を選んでください</p>
      </div>
      <div class="sheet-actions">
        <button id="delete-btn" class="danger-btn" type="button" hidden>削除</button>
        <button id="cancel-edit-btn" class="secondary-btn" type="button">キャンセル</button>
        <button id="save-effect-btn" class="primary-btn" type="button">位置を調整</button>
      </div>
    </section>

    <section id="adjustment-mode" class="adjustment-overlay" aria-label="エフェクトの位置調整" hidden>
      <header class="adjustment-header">
        <button id="adjustment-cancel-btn" class="overlay-text-btn" type="button">キャンセル</button>
        <strong>位置を調整</strong>
        <button id="adjustment-save-btn" class="overlay-save-btn" type="button">保存</button>
      </header>
      <p class="adjustment-hint">1本指で移動・2本指で拡大縮小</p>
      <div class="adjustment-toolbar">
        <div class="adjustment-quick-actions">
          <button id="fine-adjust-toggle" class="toolbar-action-btn" type="button" aria-expanded="false">微調整</button>
          <button id="reset-effect-btn" class="toolbar-action-btn" type="button">リセット</button>
        </div>
        <div id="fine-adjust-controls" class="fine-adjust-controls" hidden>
          <div class="toolbar-position">
            <span class="toolbar-label">位置</span>
            <div class="nudge-grid" aria-label="位置を微調整">
              <button class="adjust-btn nudge-up" data-adjust="up" type="button" aria-label="上へ移動">↑</button>
              <button class="adjust-btn nudge-left" data-adjust="left" type="button" aria-label="左へ移動">←</button>
              <span class="nudge-center" aria-hidden="true">•</span>
              <button class="adjust-btn nudge-right" data-adjust="right" type="button" aria-label="右へ移動">→</button>
              <button class="adjust-btn nudge-down" data-adjust="down" type="button" aria-label="下へ移動">↓</button>
            </div>
          </div>
          <div class="scale-controls" aria-label="大きさを調整">
            <span>大きさ</span>
            <button class="adjust-btn" data-scale="down" type="button" aria-label="小さくする">−</button>
            <output id="effect-scale-value">1.00×</output>
            <button class="adjust-btn" data-scale="up" type="button" aria-label="大きくする">＋</button>
          </div>
        </div>
      </div>
    </section>

    <section id="tutorial-overlay" class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="tutorial-title" hidden>
      <div class="plain-modal">
        <h2 id="tutorial-title">使い方</h2>
        <ol>
          <li>下の一覧からエフェクトを選びます。</li>
          <li>＋ボタンで自分の画像を追加できます。</li>
          <li>中央のボタンで写真・動画を保存します。</li>
        </ol>
        <p>追加画像は、全画面の調整モードで位置と大きさを変更できます。</p>
        <button id="change-platform-btn" class="secondary-btn device-settings-btn" type="button">端末設定を変更</button>
        <button id="tutorial-close-btn" class="primary-btn" type="button">わかりました</button>
      </div>
    </section>

    <section id="platform-overlay" class="modal-layer platform-layer" role="dialog" aria-modal="true" aria-labelledby="platform-title" hidden>
      <div class="plain-modal platform-modal">
        <h2 id="platform-title">お使いの端末を選択</h2>
        <p>カメラと顔エフェクトを端末に合わせて調整します。</p>
        <div class="platform-options" role="group" aria-label="端末の種類">
          <button class="platform-choice" type="button" data-platform="ios">
            <strong>iPhone・iPad</strong>
            <span>iOS・iPadOSはこちら</span>
          </button>
          <button class="platform-choice" type="button" data-platform="android">
            <strong>Android</strong>
            <span>Androidスマートフォン・タブレットはこちら</span>
          </button>
        </div>
        <p class="platform-note">この設定は、使い方画面からあとで変更できます。</p>
        <button id="platform-cancel-btn" class="text-btn platform-cancel" type="button" hidden>キャンセル</button>
      </div>
    </section>

    <section id="delete-dialog" class="modal-layer" role="alertdialog" aria-modal="true" aria-labelledby="delete-title" hidden>
      <div class="plain-modal compact">
        <h2 id="delete-title">エフェクトを削除しますか</h2>
        <div class="dialog-actions">
          <button id="delete-cancel-btn" class="secondary-btn" type="button">キャンセル</button>
          <button id="delete-confirm-btn" class="danger-filled-btn" type="button">削除</button>
        </div>
      </div>
    </section>

    <div id="flash-overlay" aria-hidden="true"></div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <div id="loading-screen" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>カメラを準備中</p>
    </div>
  </main>
</body>
</html>
